<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{file_name}} | Movie Download Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800&display=swap');

    body {
      font-family: 'Urbanist', sans-serif;
      background: linear-gradient(-45deg, #0f172a, #1e293b, #4f46e5, #9333ea, #14b8a6);
      background-size: 300% 300%;
      animation: gradientShift 14s ease infinite;
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .glass {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      padding: 2rem;
    }

    video {
      width: 100%;
      height: 95vh;
      object-fit: contain;
      border-radius: 1.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }

    .btn-smooth {
      transition: all 0.3s ease;
    }

    .btn-smooth:hover {
      transform: translateY(-4px) scale(1.06);
      box-shadow: 0 16px 35px rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 pt-10">
    <div class="text-center mb-8">
      <h2 class="text-4xl font-bold text-cyan-300 tracking-wide">{{file_name}}</h2>
    </div>

    <!-- Video Player -->
    <div class="glass">
      <video controls>
        <source src="{{file_url}}" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>

    <!-- Player Buttons -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-5 mt-12 text-center">
      <button onclick="vlc_player()" class="glass py-3 font-semibold text-lg btn-smooth">VLC</button>
      <button onclick="mx_player()" class="glass py-3 font-semibold text-lg btn-smooth">MX</button>
      <button onclick="playit_player()" class="glass py-3 font-semibold text-lg btn-smooth">PlayIt</button>
      <button onclick="km_player()" class="glass py-3 font-semibold text-lg btn-smooth">KM</button>
      <button onclick="s_player()" class="glass py-3 font-semibold text-lg btn-smooth">S</button>
      <button onclick="hd_player()" class="glass py-3 font-semibold text-pink-400 text-lg btn-smooth">HD</button>
    </div>

    <!-- Download Button -->
    <div class="text-center mt-16">
      <button onclick="Download()" class="bg-gradient-to-r from-fuchsia-500 via-purple-600 to-indigo-600 hover:to-indigo-700 text-white text-xl px-14 py-5 rounded-full font-bold btn-smooth shadow-2xl">
        Download Now
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center mt-24 text-gray-300 text-sm py-12">
    &copy; 2025 — Watch & Download Instantly.
  </footer>

</body>
</html>
