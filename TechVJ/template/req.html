<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>Smart All-in-One Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Plyr -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.6.9/plyr.css" />
  <script src="https://cdn.plyr.io/3.6.9/plyr.polyfilled.js"></script>

  <!-- Video.js -->
  <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>

  <style>
    body {
      background: #0f172a;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      color: #f8fafc;
    }
    header {
      background: linear-gradient(to right, #f97316, #ec4899);
      padding: 1.5rem;
      text-align: center;
      font-size: 2rem;
      font-weight: bold;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 2rem 1rem;
    }
    .video-section {
      background: #1e293b;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.3);
    }
    .player-box video,
    .video-js {
      width: 100%;
      max-width: 100%;
      border-radius: 10px;
      display: none;
    }
    .btn {
      background: #334155;
      border: none;
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      border-radius: 8px;
      margin: 0.5rem;
      cursor: pointer;
      color: #facc15;
      transition: 0.3s;
    }
    .btn:hover {
      background: #475569;
      color: white;
    }
    .btn.active {
      background: linear-gradient(to right, #f97316, #ec4899);
      color: white;
    }
    .download-btn {
      display: inline-block;
      margin-top: 1rem;
      background: linear-gradient(to right, #f97316, #ec4899);
      color: white;
      padding: 0.9rem 2rem;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
    }
    .settings {
      background: #0f172a;
      padding: 1.5rem;
      border-radius: 12px;
      margin-top: 2rem;
      box-shadow: 0 0 10px rgba(255,255,255,0.05);
    }
    .settings h3 {
      color: #facc15;
      margin-bottom: 1rem;
    }
    .setting-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      border-bottom: 1px dashed #475569;
      padding-bottom: 0.5rem;
    }
    .toggle {
      width: 50px;
      height: 24px;
      background: #475569;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
    }
    .toggle::before {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      top: 1px;
      left: 1px;
      transition: 0.3s;
    }
    .toggle.active::before {
      transform: translateX(26px);
      background: #10b981;
    }
  </style>
</head>
<body>

<header>Smart All-in-One Player</header>

<div class="container">
  <div class="video-section">
    <h2 style="text-align: center; color: #fcd34d;">{{file_name}}</h2>

    <div class="btn-group" style="text-align:center;">
      <button class="btn active" onclick="switchPlayer('native')">Native</button>
      <button class="btn" onclick="switchPlayer('plyr')">Plyr.js</button>
      <button class="btn" onclick="switchPlayer('videojs')">Video.js</button>
    </div>

    <div class="player-box">
      <video id="nativePlayer" controls>
        <source src="{{file_url}}" type="video/mp4">
      </video>

      <video id="plyrPlayer" controls playsinline>
        <source src="{{file_url}}" type="video/mp4">
      </video>

      <video id="videojsPlayer" class="video-js vjs-default-skin" controls preload="auto" data-setup="{}">
        <source src="{{file_url}}" type="video/mp4" />
      </video>
    </div>

    <div style="text-align:center;">
      <a class="download-btn" href="{{file_url}}" download>Download Video</a>
    </div>
  </div>

  <div class="settings">
    <h3>Player Settings</h3>
    <div class="setting-item">
      <span>Autoplay</span>
      <div class="toggle" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="setting-item">
      <span>Subtitles</span>
      <div class="toggle" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="setting-item">
      <span>HD Streaming</span>
      <div class="toggle active" onclick="this.classList.toggle('active')"></div>
    </div>
    <div class="setting-item">
      <span>Dark Mode</span>
      <div class="toggle active" onclick="this.classList.toggle('active')"></div>
    </div>
  </div>
</div>

<script>
  const plyr = new Plyr('#plyrPlayer');
  const vjs = videojs('videojsPlayer');

  function switchPlayer(type) {
    document.querySelectorAll('video').forEach(v => v.style.display = 'none');
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));

    document.getElementById('nativePlayer').pause();
    document.getElementById('plyrPlayer').pause();
    vjs.pause();

    if (type === 'native') {
      document.getElementById('nativePlayer').style.display = 'block';
    } else if (type === 'plyr') {
      document.getElementById('plyrPlayer').style.display = 'block';
    } else if (type === 'videojs') {
      document.getElementById('videojsPlayer').style.display = 'block';
    }

    document.querySelector(`.btn[onclick="switchPlayer('${type}')"]`).classList.add('active');
  }

  switchPlayer('native');
</script>

</body>
</html>
